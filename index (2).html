<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parkway | Smart Parking</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#14233a;font:16px system-ui,sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:22px}header,.hero,.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:23px;letter-spacing:-.06em}header b{display:inline-grid;place-items:center;background:var(--accent);color:#fff;border-radius:9px;width:34px;height:34px;margin-right:6px}header span,footer,.top span{color:#526179;font-size:13px}main{padding-top:0}.hero{background:#152541;color:#fff;border-radius:20px;padding:clamp(24px,5vw,58px);background-image:repeating-linear-gradient(135deg,transparent 0 70px,#ffffff12 71px 72px)}h1{font-size:clamp(45px,7vw,88px);letter-spacing:-.075em;margin:5px 0;line-height:1}p{line-height:1.55}.hero p{margin-bottom:0;color:#dce4f3}.hero small,.badge{color:#d8ffad;font-weight:700}.badge{border:1px solid #ffffff50;border-radius:20px;padding:8px 13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.panel{background:#fff;border:1px solid #dfe5ed;border-radius:14px;padding:16px}.stat b{font-size:28px;display:block}.stat span{color:#526179;font-size:14px}.layout{display:grid;grid-template-columns:2fr 1fr;gap:15px}h2{font-size:21px;margin:0 0 12px}.top span{align-self:start}#map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bay{min-height:78px;border:1px solid #9cc8b5;background:#e2f4eb;color:#164938;border-radius:8px;padding:7px;font-weight:700}.bay small{display:block;font-weight:500}.bay.occupied{background:#edf0f4;color:#445168;border-color:#c8d0dc}.bay.offline{background:#ffead7;color:#763d09;border-color:#e8b17a}.bay[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:-3px}.bay:disabled{opacity:.45}.lane{grid-column:1/-1;text-align:center;color:#526179;font-size:13px;padding:9px;border-block:1px dashed #acb7c8}.legend,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.legend{font-size:12px;color:#526179}.legend span:first-child{color:#16654b}.legend span:last-child{color:#8b4c10}button,select{cursor:pointer;font:inherit}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.controls button,select{padding:8px 11px;border:1px solid #cbd4e4;border-radius:7px;background:var(--tint);color:#14233a}.controls label{display:grid;gap:5px}.side ol{padding-left:20px;color:#41536c;font-size:14px}.side li{margin-bottom:8px}.side #status{background:var(--tint);padding:12px;border-radius:8px}footer{padding-top:0}@media(max-width:720px){.layout{grid-template-columns:1fr}header,main,footer{padding-inline:13px}.stat,.panel{padding:11px}#map{gap:5px}.bay{font-size:13px}.bay small{font-size:10px}}body[data-mode="0"] .hero{background-color:#183f9e}body[data-mode="0"] .stat:first-child{background:#e4f0ff}
body[data-mode="1"]{background:#101b21;color:#ecf7f4}body[data-mode="1"] .hero{background-color:#153731}body[data-mode="1"] .panel,body[data-mode="1"] .stat{background:#1b2a30;border-color:#344950}body[data-mode="1"] header span,body[data-mode="1"] footer,body[data-mode="1"] .stat span,body[data-mode="1"] .top span,body[data-mode="1"] .lane,body[data-mode="1"] .legend span,body[data-mode="1"] .side li{color:#bcd2d5}body[data-mode="1"] .side #status{color:#123429}
body[data-mode="2"]{background:#f4eefb}body[data-mode="2"] .hero{background-color:#472376}body[data-mode="2"] .layout{grid-template-columns:1.15fr 1fr}body[data-mode="2"] .side{grid-column:1;grid-row:1}body[data-mode="2"] .controls button{border-color:#c6acec;font-weight:650}body[data-mode="2"] .controls button:first-child{background:#7039ca;color:white}@media(max-width:720px){body[data-mode="2"] .layout{grid-template-columns:1fr}}
body[data-mode="0"]{--accent:#2d5be3;--tint:#edf2ff}body[data-mode="1"]{--accent:#007f6e;--tint:#e6f7ef}body[data-mode="2"]{--accent:#7039ca;--tint:#f3eaff}nav{max-width:1160px;margin:0 auto 16px;padding:0 22px;display:flex;gap:8px;flex-wrap:wrap}nav a{color:inherit;text-decoration:none;padding:9px 13px;border-radius:8px;border:1px solid #a8b3c4;font-size:14px;font-weight:650}nav a[aria-current]{background:var(--accent);color:white;border-color:var(--accent)}nav a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}@media(max-width:720px){nav{padding-inline:13px}}
</style></head><body data-mode="0"><header><strong><b>P</b> Parkway</strong><span>SMART PARKING</span></header><nav aria-label="Parking views"><a href="#driver">Find a Space</a><a href="#operator">Control Room</a><a href="#demo">Sensor Demo</a><a href="project.html">Project Overview</a></nav><main></main><template id="view0"><section class="hero"><div><small>Driver view</small><h1>Find a space</h1><p>Choose an available bay for your visit.</p></div><div class="badge">● Simulated data</div></section><div class="stats" id="stats"></div><div class="layout"><section class="panel"><div class="top"><h2>Car park map</h2><span>Ground floor</span></div><div id="map"></div><div class="legend"><span>● Available</span><span>● Occupied</span><span>● Sensor offline</span></div></section><section class="panel side"><h2>Your bay</h2><div class="controls"><label>Bay type <select id="filter"><option>All bays</option><option>Standard</option><option>Accessible</option><option>EV charging</option></select></label><button id="reset">Clear selection</button></div><p id="status" role="status"></p><ol id="events"></ol></section></div></template><template id="view1"><section class="hero"><div><small>Operator dashboard</small><h1>Control room</h1><p>Monitor occupancy and sensor health across the car park.</p></div><div class="badge">● Simulated data</div></section><div class="stats" id="stats"></div><div class="layout"><section class="panel"><div class="top"><h2>Car park map</h2><span>Ground floor</span></div><div id="map"></div><div class="legend"><span>● Available</span><span>● Occupied</span><span>● Sensor offline</span></div></section><section class="panel side"><h2>Operations</h2><div class="controls"><button id="fault">Simulate sensor fault</button><button id="restore">Restore sensor</button><button id="arrive">Simulate arrival</button><button id="leave">Simulate departure</button></div><p id="status" role="status"></p><ol id="events"></ol></section></div></template><template id="view2"><section class="hero"><div><small>Interactive presentation</small><h1>Sensor demo</h1><p>Show how a vehicle changes the reading and bay status.</p></div><div class="badge">● Simulated data</div></section><div class="stats" id="stats"></div><div class="layout"><section class="panel"><div class="top"><h2>Car park map</h2><span>Ground floor</span></div><div id="map"></div><div class="legend"><span>● Available</span><span>● Occupied</span><span>● Sensor offline</span></div></section><section class="panel side"><h2>Demo controls</h2><div class="controls"><button id="arrive">Car arrives</button><button id="leave">Car leaves</button><button id="reset">Reset demo</button></div><p id="status" role="status"></p><ol id="events"></ol></section></div></template><footer>Parkway · Smart parking group project</footer><script>let mode;
const by=id=>document.getElementById(id);
const bays=Array.from({length:12},(_,i)=>({id:String.fromCharCode(65+Math.floor(i/4))+(i%4+1),type:i===0||i===4?'Accessible':i===3||i===7?'EV charging':'Standard',occupied:[1,5,6,9].includes(i),offline:false}));
let selected=null,events=[];
const selections=[null,bays[0],bays[0]];
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function render(){
 const occupied=bays.filter(b=>b.occupied&&!b.offline).length,offline=bays.filter(b=>b.offline).length;
 const metrics=[['Available bays',bays.length-occupied-offline],['Occupied bays',occupied],[mode===0?'Total bays':'Sensors online',mode===0?bays.length:bays.length-offline]];
 by('stats').replaceChildren(...metrics.map(([label,value])=>{const n=node('div','','stat');n.append(node('b',value),node('span',label));return n}));
 const filter=by('filter')?.value??'All bays';
 by('map').replaceChildren();
 for(const [index,bay] of bays.entries()){
  if(index===4||index===8)by('map').append(node('div','←   Drive aisle   →','lane'));
  const state=bay.offline?'Offline':bay.occupied?'Occupied':'Available';
  const button=node('button',bay.id,'bay '+state.toLowerCase());
  button.append(node('small',state),node('small',bay.type));
  button.setAttribute('aria-pressed',selected===bay);
  button.disabled=mode===0&&(bay.offline||bay.occupied||(filter!=='All bays'&&filter!==bay.type));
  button.onclick=()=>{selected=bay;selections[mode]=bay;render();by('map').querySelector('[aria-pressed=true]')?.focus()};
  by('map').append(button);
 }
 if(!selected)by('status').textContent='Select an available bay on the map.';
 else if(mode===0)by('status').textContent=selected.id+' selected · '+selected.type+'. Selection is for demonstration only.';
 else if(mode===2)by('status').textContent=selected.offline?selected.id+' · Sensor offline. Restore it in Control Room.':selected.id+' · Simulated distance '+(selected.occupied?'35 cm → Occupied':'180 cm → Available')+'. Detection threshold: 60 cm.';
 else by('status').textContent=selected.id+' · '+(selected.offline?'Sensor offline':selected.occupied?'Occupied · Sensor online':'Available · Sensor online');
 by('events').replaceChildren(...events.map(event=>node('li',event)));
}
function change(key,value,action){
 if(!selected||selected[key]===value||(key==='occupied'&&selected.offline))return;
 selected[key]=value;events=[selected.id+' · '+action,...events].slice(0,6);render();
}
function bindControls(){
if(by('filter'))by('filter').onchange=()=>{if(selected&&by('filter').value!=='All bays'&&selected.type!==by('filter').value)selected=selections[0]=null;render()};
if(by('arrive'))by('arrive').onclick=()=>change('occupied',true,'Vehicle arrived');
if(by('leave'))by('leave').onclick=()=>change('occupied',false,'Vehicle departed');
if(by('fault'))by('fault').onclick=()=>change('offline',true,'Sensor offline');
if(by('restore'))by('restore').onclick=()=>change('offline',false,'Sensor restored');
if(by('reset'))by('reset').onclick=()=>{if(mode===0)selected=selections[0]=null;else{bays.forEach((b,i)=>{b.occupied=[1,5,6,9].includes(i);b.offline=false});selected=selections[2]=bays[0];events=[]}render()};
}
function openView(){
 const views=['driver','operator','demo'];
 mode=Math.max(0,views.indexOf(location.hash.slice(1)));
 document.body.dataset.mode=mode;
 document.querySelector('main').replaceChildren(by('view'+mode).content.cloneNode(true));
 for(const link of document.querySelectorAll('nav a')){
  if(link.hash==='#'+views[mode])link.setAttribute('aria-current','page');
  else link.removeAttribute('aria-current');
 }
 selected=selections[mode];
 if(mode===0&&(selected?.occupied||selected?.offline))selected=selections[0]=null;
 bindControls();
 render();
}
window.addEventListener('hashchange',openView);
openView();
</script></body></html>
